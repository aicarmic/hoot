name: SAT reminders

# Runs every hour. Each device chose when it wants reminders (in Hoot's Settings), in its own
# time zone, and the script sends to the devices whose hour this is. Setup: docs/SETUP-reminders.md.
on:
  schedule:
    - cron: '3 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Send every device today's reminder now, whatever the time
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sat-nudge

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/sat-nudge.mjs
        env:
          SCHEDULE: ${{ github.event.schedule }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
